<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1A14"/>
      <stop offset="1" stop-color="#05090B"/>
    </linearGradient>
    <linearGradient id="growth" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#16C784"/>
      <stop offset="1" stop-color="#4ADE80"/>
    </linearGradient>
  </defs>

  <!-- rounded-square dark brand background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- soft growth glow -->
  <circle cx="256" cy="256" r="170" fill="#16C784" opacity="0.12"/>

  <!-- rising market line (behind the naira mark) -->
  <g fill="none" stroke="url(#growth)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <path d="M72 396 L168 322 L252 348 L430 240"/>
  </g>
  <path d="M430 240 L408 296 L370 234 Z" fill="url(#growth)"/>

  <!-- naira mark (₦): N + double bar, white -->
  <g stroke="#F8FAFC" stroke-width="52" stroke-linecap="round" fill="none">
    <path d="M198 108 V 404"/>
    <path d="M314 108 V 404"/>
    <path d="M314 108 L 198 404"/>
    <path d="M158 214 H 354"/>
    <path d="M158 298 H 354"/>
  </g>
</svg>
