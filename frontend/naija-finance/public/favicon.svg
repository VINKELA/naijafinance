<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- NaijaFinance Hub mark v7 — "NF Hub": flat professional monogram.
       Dark tile, bold white NF, F's middle bar rises into a solid green
       growth arrow (hub + markets). No gradients, no glow. -->
  <rect width="512" height="512" rx="112" fill="#0C1A14"/>
  <!-- N -->
  <g stroke="#FFFFFF" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M150 110 V 402"/>
    <path d="M150 110 L 262 402"/>
    <path d="M262 110 V 402"/>
  </g>
  <!-- F stem + top bar -->
  <g stroke="#FFFFFF" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M334 110 V 402"/>
    <path d="M334 110 H 434"/>
  </g>
  <!-- F middle bar -> green rising arrow (structural, visible at 16px) -->
  <g stroke="#16C784" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M334 236 L 420 150"/>
  </g>
  <path d="M424 142 L 382 156 L 398 184 Z" fill="#16C784"/>
</svg>
